# ========================================================================
# 配置比对系统 - Nginx 配置文件
# 路径：/etc/nginx/conf.d/config_compare.conf
# ========================================================================

server {
    listen 80;
    server_name localhost;  # 修改为你的域名或IP
    
    # 静态文件根目录（根据你的实际路径修改）
    root /usr/share/nginx/html/config_compare/dist;
    index index.html;
    
    # 字符集
    charset utf-8;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml application/json
               application/javascript image/svg+xml;
    
    # ==================== 前端静态资源 ====================
    
    # 主路由（支持Vue Router的history模式）
    location / {
        try_files $uri $uri/ /index.html;
        
        # HTML文件不缓存（确保更新后立即生效）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # JS、CSS、字体、图片等静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;  # 缓存7天
        add_header Cache-Control "public, immutable";
    }
    
    # ==================== 后端API代理 ====================
    
    # 代理所有/api/开头的请求到后端服务
    location /api/ {
        # 后端服务地址（修改为你的实际后端地址和端口）
        proxy_pass http://localhost:8080/api/;
        
        # 代理头设置
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 禁用代理缓冲（适合实时数据，如果需要）
        # proxy_buffering off;
    }
    
    # ==================== 安全设置 ====================
    
    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ==================== 日志配置 ====================
    
    access_log /var/log/nginx/config_compare_access.log;
    error_log /var/log/nginx/config_compare_error.log warn;
}

# ========================================================================
# 配置说明：
# 
# 1. server_name: 改成你的域名或IP地址
# 2. root: 确保路径指向你的dist目录
# 3. proxy_pass: 改成你的后端服务实际地址
# 4. 部署后执行: sudo nginx -t && sudo nginx -s reload
# ========================================================================

